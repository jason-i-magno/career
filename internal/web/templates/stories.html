{{define "content" -}}
<header>
<h1>Stories</h1>
</header>

{{with .Gaps}}
<section>
<h2>Gaps <span class="count">{{len .}}</span></h2>
<p>{{comps .}}</p>
</section>
{{end}}

{{with .Stories}}
<ul class="rows">
{{range .}}{{$r := ready .}}<li><a href="/stories/{{.ID}}">
<strong>{{.Title}}</strong>
<span class="row-meta"><span class="badge badge-{{$r.Class}}">{{$r.Label}}</span>{{with .Competencies}}<span class="muted">{{comps .}}</span>{{end}}</span>
</a></li>
{{end}}</ul>
{{else}}
<p class="clear">No stories yet. Draft one with <code>career story add</code>.</p>
{{end}}
{{- end}}
